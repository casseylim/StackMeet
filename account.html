<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NADITrack Account Setup</title>
    <link rel="icon" type="image/png" href="assets/stackmeet-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell account-shell">
      <section class="panel account-panel">
        <span class="brand-mark login-mark"><img src="assets/stackmeet-logo.png" alt="NADITrack logo" /></span>
        <p class="eyebrow">NADITrack Account</p>
        <h1 id="accountTitle">Set Password</h1>
        <form id="accountForm" class="admin-form">
          <label id="displayNameLabel">Display Name<input id="accountDisplayName" autocomplete="name" /></label>
          <label>New Password<input id="accountPassword" type="password" autocomplete="new-password" required /></label>
          <label>Confirm Password<input id="accountConfirmPassword" type="password" autocomplete="new-password" required /></label>
          <p class="form-error" id="accountMessage" aria-live="polite"></p>
          <button class="primary" type="submit">Save Password</button>
        </form>
      </section>
    </main>
    <script src="account.js"></script>
  </body>
</html>
