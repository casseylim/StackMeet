<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StackMeet Competition Admin</title>
    <link rel="icon" type="image/png" href="assets/stackmeet-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>Competition Administration</h1>
        </div>
        <button class="ghost" id="refreshAdmin" type="button">Refresh</button>
      </header>

      <section class="panel admin-auth-panel">
        <label>Admin Key<input id="adminKey" type="password" autocomplete="off" /></label>
        <button class="primary" id="saveAdminKey" type="button">Use Key</button>
        <p class="muted">The admin key is entered locally for this browser session and is not stored in source code.</p>
      </section>

      <section class="split admin-split">
        <article class="panel">
          <div class="panel-head"><h2>Competitions</h2></div>
          <div id="adminMessage" class="form-error" aria-live="polite"></div>
          <div class="table-wrap"><table><thead><tr><th>Key</th><th>Name</th><th>Status</th><th>State</th><th>Updated</th><th></th></tr></thead><tbody id="competitionAdminRows"></tbody></table></div>
        </article>

        <article class="panel">
          <div class="panel-head"><h2 id="adminFormTitle">Create Competition</h2></div>
          <form id="competitionAdminForm" class="admin-form">
            <input id="adminOriginalKey" type="hidden" />
            <label>Competition Key<input id="adminCompetitionKey" autocomplete="off" required /></label>
            <label>Competition Code<input id="adminCompetitionCode" autocomplete="off" /></label>
            <label>Name<input id="adminCompetitionName" required /></label>
            <label>Venue<input id="adminCompetitionVenue" required /></label>
            <label>Start Date<input id="adminStartDate" type="date" required /></label>
            <label>End Date<input id="adminEndDate" type="date" required /></label>
            <label>Status<select id="adminStatus"><option>Draft</option><option>Active</option><option>Closed</option><option>Archived</option></select></label>
            <label>Password<input id="adminPassword" type="password" autocomplete="new-password" /></label>
            <div class="button-row">
              <button class="primary" type="submit">Save</button>
              <button class="ghost" id="newCompetition" type="button">New</button>
            </div>
          </form>

          <div class="admin-actions">
            <button class="ghost" data-admin-action="export" type="button">Export JSON</button>
            <button class="ghost" data-admin-action="init" type="button">Initialize State</button>
            <button class="ghost" data-admin-action="close" type="button">Close</button>
            <button class="ghost" data-admin-action="archive" type="button">Archive</button>
            <button class="danger-button" data-admin-action="reset" type="button">Reset State</button>
          </div>
          <pre id="adminJsonOutput" class="admin-json" hidden></pre>
        </article>
      </section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
