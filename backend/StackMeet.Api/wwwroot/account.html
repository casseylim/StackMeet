<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NADITrack Account Setup</title>
    <link rel="icon" type="image/png" href="assets/stackmeet-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell account-shell">
      <section class="panel account-panel">
        <label class="operator-language-label" for="operatorLanguage" data-i18n="Language">Language<select id="operatorLanguage"><option value="en" data-i18n="English">English</option><option value="ms" data-i18n="Bahasa Malaysia">Bahasa Malaysia</option><option value="zh-Hans" data-i18n="Simplified Chinese">简体中文</option></select></label>
        <span class="brand-mark login-mark"><img src="assets/stackmeet-logo.png" alt="NADITrack logo" data-i18n-alt="NADITrack logo" /></span>
        <p class="eyebrow" data-i18n="NADITrack Account">NADITrack Account</p>
        <h1 id="accountTitle" data-i18n="Set Password">Set Password</h1>
        <form id="accountForm" class="admin-form">
          <label id="displayNameLabel" data-i18n="Display Name">Display Name<input id="accountDisplayName" autocomplete="name" /></label>
          <label data-i18n="New Password">New Password<input id="accountPassword" type="password" autocomplete="new-password" required /></label>
          <label data-i18n="Confirm Password">Confirm Password<input id="accountConfirmPassword" type="password" autocomplete="new-password" required /></label>
          <p class="form-error" id="accountMessage" aria-live="polite"></p>
          <button class="primary" type="submit" data-i18n="Save Password">Save Password</button>
        </form>
      </section>
    </main>
    <script src="js/i18n/I18n.js?v=multilanguage-v2-phase3b"></script>
    <script src="js/i18n/locales/en.js?v=multilanguage-v2-phase3b"></script>
    <script src="js/i18n/locales/ms.js?v=multilanguage-v2-phase3b"></script>
    <script src="js/i18n/locales/zh-Hans.js?v=multilanguage-v2-phase3b"></script>
    <script src="js/i18n/LanguagePreference.js?v=multilanguage-v2-phase3b"></script>
    <script src="js/i18n/UiLocalization.js?v=multilanguage-v2-phase3b"></script>
    <script src="account.js?v=multilanguage-v2-phase3b"></script>
  </body>
</html>
