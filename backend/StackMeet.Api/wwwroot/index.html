<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistem NADITrack</title>
    <link rel="icon" type="image/png" href="assets/stackmeet-logo.png" />
    <link rel="apple-touch-icon" href="assets/stackmeet-logo.png" />
    <link rel="stylesheet" href="styles.css?v=responsive-navigation-20260818d" />
  </head>
  <body class="auth-pending">
    <section class="login-screen" id="loginScreen" aria-labelledby="loginTitle">
      <form class="login-panel" id="loginForm">
        <span class="brand-mark login-mark"><img src="assets/stackmeet-logo.png" alt="NADITrack logo" /></span>
        <label class="operator-language-label" for="operatorLanguage" data-i18n="Language">Language<select id="operatorLanguage"><option value="en" data-i18n="English">English</option><option value="ms" data-i18n="Bahasa Malaysia">Bahasa Malaysia</option><option value="zh-Hans" data-i18n="Simplified Chinese">简体中文</option></select></label>
        <p class="eyebrow" data-i18n="Secure Access">Secure Access</p>
        <h1 id="loginTitle" data-i18n="NADITrack Login">NADITrack Login</h1>
        <div id="loginCredentialsStep" class="login-step">
          <label data-i18n="Email Address">Email Address<input id="loginEmail" type="email" autocomplete="username" required /></label>
          <label data-i18n="Password">Password<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        </div>
        <div id="loginCompetitionStep" class="login-step" hidden>
          <label data-i18n="Competition">Competition<select id="loginCompetitionSelect" required disabled></select></label>
        </div>
        <p class="form-error" id="loginError" aria-live="polite"></p>
        <button class="primary" type="submit" data-i18n="Log In">Log In</button>
        <button class="ghost" id="forgotPasswordButton" type="button" data-i18n="Forgot password?">Forgot password?</button>
        <div id="forgotPasswordPanel" class="login-step" hidden>
          <label data-i18n="Reset Email">Reset Email<input id="forgotPasswordEmail" type="email" autocomplete="email" /></label>
          <button class="ghost" id="sendForgotPassword" type="button" data-i18n="Send reset link">Send reset link</button>
        </div>
        <button class="ghost" id="loginSwitchAccount" type="button" hidden data-i18n="Use Different Account">Use Different Account</button>
      </form>
    </section>
    <div class="app">
    <aside class="sidebar" id="sidebarNav" aria-label="Primary navigation" data-i18n-aria-label="Primary navigation">
      <button id="navCloseBtn" class="drawer-close ghost" type="button" aria-label="Close navigation" data-i18n-aria-label="Close navigation" data-i18n="Close">Close</button>
        <a class="brand" href="#dashboard" data-route="dashboard">
          <span class="brand-mark"><img src="assets/stackmeet-logo.png" alt="StackMeet logo" data-i18n-alt="StackMeet logo" /></span>
          <span>
            <strong data-brand="sidebarTitle">WSSA</strong>
            <small data-brand="sidebarSubtitle">Sport Stacking Centre</small>
          </span>
        </a>
        <nav id="nav"></nav>
        <div class="sidebar-card">
          <span data-i18n="Online mode">Online mode</span>
          <strong id="saveStatus" data-state="saved" aria-live="polite" data-i18n="Saved">Saved</strong>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button id="navMenuBtn" class="ghost nav-menu-button" type="button" aria-expanded="false" aria-controls="sidebarNav" data-i18n="Menu">Menu</button>
          <div>
            <p class="eyebrow" id="competitionType" hidden></p>
            <h1 id="pageTitle" data-i18n="Dashboard">Dashboard</h1>
          </div>
          <div class="top-actions">
            <label class="operator-language-control" for="operatorLanguageAuthenticated"><svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3Z"></path></svg><span class="visually-hidden" data-i18n="Language">Language</span><select id="operatorLanguageAuthenticated" aria-label="Language" data-i18n-aria-label="Language"><option value="en" data-i18n="English">English</option><option value="ms" data-i18n="Bahasa Malaysia">Bahasa Malaysia</option><option value="zh-Hans" data-i18n="Simplified Chinese">简体中文</option></select></label>
            <button id="logoutBtn" class="ghost" type="button" data-i18n="Log Out">Log Out</button>
          </div>
        </header>

        <section class="hero" id="dashboardHero">
          <img src="assets/competition-banner.png" alt="Sport stacking competition table" data-i18n-alt="Sport stacking competition table" />
          <div class="hero-content">
            <p id="heroEventTitle" data-domain>WSSA NS Sport Stacking Centre</p>
            <h2 data-i18n="Run registration, print preparation, data entry, results, and leaderboards from one place.">Run registration, print preparation, data entry, results, and leaderboards from one place.</h2>
          </div>
        </section>

        <main id="view"></main>
      </div>
    </div>
    <div id="navBackdrop" class="drawer-backdrop" hidden></div>

    <template id="dashboardView">
      <section class="metric-grid">
        <article><span data-i18n="Stackers">Stackers</span><strong data-metric="stackers"></strong><small data-metric="gender"></small></article>
        <article><span data-i18n="Doubles Teams">Doubles Teams</span><strong data-metric="doubles"></strong><small data-i18n="completed teams">completed teams</small></article>
        <article><span data-i18n="Relay Teams">Relay Teams</span><strong data-metric="relay"></strong><small data-i18n="ready teams">ready teams</small></article>
        <article><span data-i18n="Divisions">Divisions</span><strong data-metric="divisions"></strong><small data-i18n="active award groups">active award groups</small></article>
        <article><span data-i18n="Fastest Official">Fastest Official</span><strong data-metric="fastest"></strong><small data-i18n="all events">all events</small></article>
      </section>
      <section>
        <article class="panel">
          <div class="panel-head">
            <h2 data-i18n="Tournament Snapshot">Tournament Snapshot</h2>
          </div>
          <div id="snapshot"></div>
        </article>
      </section>
    </template>

    <template id="settingsView">
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Competition Settings">Competition Settings</h2>
          <button class="primary" data-action="save-settings" type="button" data-i18n="Save Settings">Save Settings</button>
        </div>
        <div class="form-grid">
          <label data-i18n="Competition Name">Competition Name<input id="settingName" /></label>
          <label data-i18n="Type">Type<select id="settingType"><option data-i18n="Sanctioned">Sanctioned</option><option data-i18n="Recreational">Recreational</option><option data-i18n="Online">Online</option></select></label>
          <label data-i18n="Competition Date (Start)">Competition Date (Start)<input id="settingStart" type="date" /></label>
          <label data-i18n="Competition Date (End)">Competition Date (End)<input id="settingEnd" type="date" /></label>
          <label data-i18n="KBS Logo">KBS Logo<select id="settingKbsLogo"><option value="No" data-i18n="No">No</option><option value="Yes" data-i18n="Yes">Yes</option></select></label>
          <label data-i18n="Prelim Rounds">Prelim Rounds<select id="settingPrelims"><option value="0" data-i18n="0 Round">0 Round</option><option value="1" data-i18n="1 Round">1 Round</option></select></label>
          <label data-i18n="Final Rounds">Final Rounds<select id="settingFinals"><option value="1" data-i18n="1 Round">1 Round</option></select></label>
          <label data-i18n="SOC">SOC<select id="settingSoc"><option value="Yes" data-i18n="Yes">Yes</option><option value="No" data-i18n="No">No</option></select></label>
          <label data-i18n="Prelim Times Data Entry">Prelim Times Data Entry<select id="settingPrelimTimes"><option value="best" data-i18n="Best">Best</option><option value="all" data-i18n="All">All</option></select></label>
          <label data-i18n="Paperless Entry">Paperless Entry<select id="settingPaperless"><option value="Yes" data-i18n="Yes">Yes</option><option value="No" data-i18n="No">No</option></select></label>
          <label data-i18n="Public Results Default Language">Public Results Default Language<select id="settingLanguage"><option value="en" data-i18n="English">English</option><option value="ms" data-i18n="Bahasa Malaysia">Bahasa Malaysia</option><option value="zh-Hans" data-i18n="Simplified Chinese">简体中文</option></select></label>
          <label class="checkbox-field"><input id="settingSeparateSpecialGender" type="checkbox" /> <span><strong data-i18n="Separate Special Stacker Divisions by Gender">Separate Special Stacker Divisions by Gender</strong><small data-i18n="When enabled, Special Stacker results will be divided into separate male and female divisions.">When enabled, Special Stacker results will be divided into separate male and female divisions.</small></span></label>
          <label data-i18n="Age Calculation">Age Calculation<select id="settingAgeCalculation"><option value="actual" data-i18n="Actual Age on Competition Date">Actual Age on Competition Date</option><option value="yearBorn" data-i18n="Year Born Only">Year Born Only</option></select></label>
          <label data-i18n="Advance Individuals">Advance Individuals<input id="settingAdvanceIndividuals" type="number" min="0" /></label>
          <label data-i18n="Advance Doubles">Advance Doubles<input id="settingAdvanceDoubles" type="number" min="0" /></label>
          <label data-i18n="Advance C/P Doubles">Advance C/P Doubles<input id="settingAdvanceCpDoubles" type="number" min="0" /></label>
          <label data-i18n="Advance Timed Relay">Advance Timed Relay<input id="settingAdvanceRelay" type="number" min="0" /></label>
          <label data-i18n="Time Sheets Input">Time Sheets Input<select id="settingTimeSheetInput"><option value="blank" data-i18n="blank">blank</option></select></label>
        </div>
        <p class="muted" data-i18n="Paperless mode allows prelim data entry by stacker ID instead of time sheet ID.">Paperless mode allows prelim data entry by stacker ID instead of time sheet ID.</p>
      </section>
      <section class="panel" aria-labelledby="brandingHeading">
        <div class="panel-head"><h2 id="brandingHeading" data-i18n="Competition Branding">Competition Branding</h2></div>
        <p class="muted" data-i18n="Upload an optional competition logo and banner. Files are validated and stored separately from the application publish files.">Upload an optional competition logo and banner. Files are validated and stored separately from the application publish files.</p>
        <div class="form-grid branding-assets-grid">
          <div class="branding-asset-card"><h3 data-i18n="Logo">Logo</h3><img id="competitionLogoPreview" alt="Competition logo preview" data-i18n-alt="competition-logo preview" hidden /><input id="competitionLogoFile" type="file" accept="image/png,image/jpeg,image/webp" /><button class="primary" data-action="upload-asset" data-asset-type="logo" type="button" data-i18n="Upload Logo">Upload Logo</button><button class="ghost" data-action="remove-asset" data-asset-type="logo" type="button" data-i18n="Remove Logo">Remove Logo</button></div>
          <div class="branding-asset-card"><h3 data-i18n="Banner">Banner</h3><img id="competitionBannerPreview" alt="Competition banner preview" data-i18n-alt="competition-banner preview" hidden /><input id="competitionBannerFile" type="file" accept="image/png,image/jpeg,image/webp" /><button class="primary" data-action="upload-asset" data-asset-type="banner" type="button" data-i18n="Upload Banner">Upload Banner</button><button class="ghost" data-action="remove-asset" data-asset-type="banner" type="button" data-i18n="Remove Banner">Remove Banner</button></div>
        </div>
        <p id="competitionBrandingStatus" class="muted" role="status"></p>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Events">Events</h2>
          <button class="primary" data-action="save-events" type="button" data-i18n="Save Events">Save Events</button>
        </div>
        <div id="eventMatrix" class="check-grid"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Team Builders">Team Builders</h2>
        </div>
        <div class="team-builder-grid">
          <button class="team-builder-action" data-route="doubles" type="button">
            <strong data-i18n="Doubles Team Builder">Doubles Team Builder</strong>
            <span data-i18n="Choose 2 stackers to create a Doubles Team.">Choose 2 stackers to create a Doubles Team.</span>
          </button>
          <button class="team-builder-action" data-route="relay" type="button">
            <strong data-i18n="Relay Team Builder">Relay Team Builder</strong>
            <span data-i18n="Choose at least 4 stackers, with up to 2 optional backups.">Choose at least 4 stackers, with up to 2 optional backups.</span>
          </button>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Divisions">Divisions</h2>
          <button class="primary" data-action="save-divisions" type="button" data-i18n="Save Divisions">Save Divisions</button>
        </div>
        <p class="muted" data-i18n="Tick the age where a division should end. Skipped ages are grouped into the next selected age.">Tick the age where a division should end. Skipped ages are grouped into the next selected age.</p>
        <section class="division-section" aria-labelledby="individualDivisionsHeading">
          <div class="panel-subhead"><h3 id="individualDivisionsHeading" data-i18n="Individual Divisions">Individual Divisions</h3></div>
          <div id="divisionCutoffs" class="division-grid"></div>
        </section>
        <div class="panel-subhead team-division-subhead">
          <h3 data-i18n="Team Division Setup">Team Division Setup</h3>
          <span class="muted" data-i18n="Doubles and Relay cutoff ages">Doubles and Relay cutoff ages</span>
        </div>
        <section class="division-section" aria-labelledby="doublesDivisionsHeading">
          <div class="panel-subhead"><h3 id="doublesDivisionsHeading" data-i18n="Doubles Divisions">Doubles Divisions</h3></div>
          <div id="doublesDivisionCutoffs" class="doubles-division-grid"></div>
        </section>
        <section class="division-section" aria-labelledby="relayDivisionsHeading">
          <div class="panel-subhead"><h3 id="relayDivisionsHeading" data-i18n="Relay Divisions">Relay Divisions</h3></div>
          <div id="relayDivisionCutoffs" class="relay-division-grid"></div>
        </section>
        <div class="panel-subhead">
          <h3 data-i18n="Generated Divisions">Generated Divisions</h3>
          <button class="ghost" data-action="add-division" type="button" data-i18n="Add Custom Division">Add Custom Division</button>
        </div>
        <div id="divisionList" class="tag-editor"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Leader Board">Leader Board</h2>
          <div class="action-row">
            <button class="ghost" data-action="open-leaderboard" type="button" data-i18n="Open Display">Open Display</button>
            <button class="primary" data-action="save-leaderboard" type="button" data-i18n="Save Display">Save Display</button>
          </div>
        </div>
        <div class="form-grid">
          <label>Type<select id="leaderType"><option>Divisional Results</option><option>Overall Results</option><option>SOC</option><option>Tournament Logo</option></select></label>
          <label>Stage<select id="leaderStage"><option>Prelims</option><option>Finals</option></select></label>
          <label>Font Size<input id="leaderFontSize" type="number" min="0.5" max="2" step="0.1" inputmode="decimal" /></label>
          <label>Background<select id="leaderBg"><option>Black</option><option>White</option></select></label>
          <label>Progress Color<select id="leaderColor"><option>Blue</option><option>Red</option><option>Green</option></select></label>
          <label>Progress Height<input id="leaderProgressHeight" type="number" min="1" max="20" step="1" inputmode="numeric" /></label>
          <label>Pause Time (seconds)<input id="leaderPause" type="number" min="1" max="300" step="1" inputmode="numeric" /></label>
          <label>Results Limit<input id="leaderLimit" type="number" min="3" max="50" /></label>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Competition Audit Logs">Competition Audit Logs</h2>
          <button class="ghost" data-action="export-competition-audit-csv" type="button" data-i18n="Export CSV">Export CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-i18n="Time">Time</th><th data-i18n="Action">Action</th><th data-i18n="Actor">Actor</th><th data-i18n="Target">Target</th><th data-i18n="Summary">Summary</th></tr></thead>
            <tbody id="competitionAuditRows"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="languageView">
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="Language Translation Setup">Language Translation Setup</h2>
          <button class="primary" data-action="save-language" type="button" data-i18n="Save Language">Save Language</button>
        </div>
        <div class="form-grid">
          <label data-i18n="Translation Language To Edit">Translation Language To Edit<select id="languageActive"><option value="ms" data-i18n="Bahasa Malaysia">Bahasa Malaysia</option><option value="zh-Hans" data-i18n="Simplified Chinese">简体中文</option></select></label>
          <label data-i18n="Search Translation">Search Translation<input id="languageSearch" data-i18n-placeholder="Search English, Bahasa Malaysia, or Chinese text" placeholder="Search English, Bahasa Malaysia, or Chinese text" /></label>
        </div>
        <div class="table-wrap language-table no-auto-translate"><table><thead><tr><th>English</th><th>Bahasa Malaysia</th></tr></thead><tbody id="languageRows"></tbody></table></div>
      </section>
    </template>

    <template id="stackersView">
      <div class="module-tabs no-print" data-module-tabs="participant">
        <button class="module-tab" data-route="stackers" data-participant-route="stackers" type="button" data-i18n="Individual">Individual</button>
        <button class="module-tab" data-route="doubles" data-participant-route="doubles" type="button" data-i18n="Doubles">Doubles</button>
        <button class="module-tab" data-route="relay" data-participant-route="relay" type="button" data-i18n="Relays">Relays</button>
      </div>
      <section class="panel">
        <div class="panel-head">
          <h2 id="stackerListHeading" tabindex="-1" data-i18n="Stackers List">Stackers List</h2>
          <div class="button-row">
            <button class="primary" data-action="show-stacker-form" id="showStackerFormBtn" type="button" data-i18n="+ Add New Stacker">+ Add New Stacker</button>
          </div>
        </div>
        <div id="stackerMessage" class="message" hidden></div>
        <section id="sqlCompetitionSetup" class="panel" hidden>
          <div class="panel-head"><h2 data-i18n="Competition Setup">Competition Setup</h2></div>
          <p class="muted" data-i18n="Create the competition for Individual Stacker registrations.">Create the competition for Individual Stacker registrations.</p>
          <div class="form-grid">
            <label>Competition Code<input id="sqlCompetitionCode" data-i18n-placeholder="e.g. 2026-MY-OPEN" placeholder="e.g. 2026-MY-OPEN" /></label>
            <label>Competition Name<input id="sqlCompetitionName" data-i18n-placeholder="Competition name" placeholder="Competition name" /></label>
            <label>Venue<input id="sqlCompetitionVenue" data-i18n-placeholder="Venue" placeholder="Venue" /></label>
            <label>Start Date<input id="sqlCompetitionStart" type="date" /></label>
            <label>End Date<input id="sqlCompetitionEnd" type="date" /></label>
            <label>Status<input id="sqlCompetitionStatus" value="Active" /></label>
            <label class="checkbox-label"><input id="sqlCompetitionPublicListing" type="checkbox" /> List this competition on the public ALL results page</label>
          </div>
          <div class="button-row"><button class="primary" data-action="create-sql-competition" type="button" data-i18n="Create Competition">Create Competition</button></div>
        </section>
        <div id="deleteStackerConfirm" class="confirm-box" hidden>
          <div>
            <strong id="deleteStackerTitle" data-i18n="Delete stacker?">Delete stacker?</strong>
            <p id="deleteStackerText" class="muted"></p>
          </div>
          <div class="button-row">
            <button class="ghost" data-action="cancel-delete-stacker" type="button" data-i18n="Cancel">Cancel</button>
            <button class="danger-button" data-action="confirm-delete-stacker" type="button" data-i18n="Delete">Delete</button>
          </div>
        </div>
        <section id="stackerForm" hidden>
          <div class="panel-subhead">
            <h3 id="stackerFormTitle" data-i18n="New Stacker">New Stacker</h3>
            <div class="button-row">
              <button class="ghost" data-action="print-stacker-sheet" id="printStackerSheetBtn" type="button" hidden data-i18n="Print Time Sheet">Print Time Sheet</button>
              <button class="ghost" data-action="cancel-stacker-edit" id="cancelStackerEdit" type="button" data-i18n="Cancel">Cancel</button>
              <button class="primary" data-action="add-stacker" id="saveStackerBtn" type="button" data-i18n="Save Stacker">Save Stacker</button>
            </div>
          </div>
        <div class="form-grid">
            <label>First Name<input id="stFirstName" data-i18n-placeholder="First name" placeholder="First name" /></label>
            <label>Last Name<input id="stLastName" data-i18n-placeholder="Last name" placeholder="Last name" /></label>
            <label>WSSA ID<input id="stWssaId" data-i18n-placeholder="Optional" placeholder="Optional" /></label>
          <label>Gender<select id="stGender"><option>M</option><option>F</option></select></label>
          <label>Date Of Birth<input id="stDob" type="date" /></label>
            <label>Age<input id="stAge" readonly data-i18n-placeholder="Auto" placeholder="Auto" /></label>
            <label>Generated Division<input id="stDivision" readonly data-i18n-placeholder="Enter DOB to preview" placeholder="Enter DOB to preview" /></label>
          <label class="checkbox-field"><input id="stSpecial" type="checkbox" /> <span data-i18n="Special / Disability">Special / Disability</span></label>
            <label>Custom Division<input id="stCustomDivision" list="customDivisionOptions" data-i18n-placeholder="Optional override" placeholder="Optional override" /><datalist id="customDivisionOptions"></datalist></label>
            <label>Organization<input id="stOrg" list="organizationOptions" data-i18n-placeholder="School or club" placeholder="School or club" /><datalist id="organizationOptions"></datalist></label>
          <label>Country<select id="stCountry"></select></label>
            <label>Region<input id="stRegion" list="regionOptions" data-i18n-placeholder="State / region" placeholder="State / region" /><datalist id="regionOptions"></datalist></label>
            <label>Email<input id="stEmail" type="email" data-i18n-placeholder="Optional" placeholder="Optional" /></label>
            <label>Phone<input id="stPhone" data-i18n-placeholder="Optional" placeholder="Optional" /></label>
          <label>Paid<select id="stPaid"><option>Yes</option><option>No</option></select></label>
          <label>Checked In<select id="stCheckedIn"><option>Yes</option><option>No</option></select></label>
        </div>
        <div id="stDoublesInfo" class="info-strip" hidden></div>
        </section>
        <div class="toolbar">
          <button class="ghost" data-action="refresh-stackers" id="refreshStackersBtn" type="button" data-i18n="Refresh">Refresh</button>
          <input id="stackerSearch" type="search" data-i18n-placeholder="Search stackers" placeholder="Search stackers" />
          <select id="stackerDivisionFilter"></select>
          <label class="ghost file-action" for="stackerCsvInput" data-i18n="Import Stackers CSV">Import Stackers CSV</label>
