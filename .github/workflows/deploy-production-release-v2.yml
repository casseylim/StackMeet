name: NADITrack Production Release v2

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        type: choice
        options: [preflight, ftp-readcheck, deploy, verify]
      commit_sha:
        description: Exact 40-char protected-master SHA
        required: true
        type: string
      live_source_sha:
        description: Source SHA of currently deployed application baseline
        required: false
        type: string
      expected_preflight_manifest_sha256:
        description: Deploy only; RELEASE_MANIFEST_SHA256 from preflight
        required: false
        type: string
      expected_live_fileset_sha256:
        description: Deploy only; LIVE_FILESET_SHA256 from ftp-readcheck
        required: false
        type: string
      expected_live_dll_sha256:
        description: ftp-readcheck/deploy; current live DLL SHA256
        required: false
        type: string
      schema_confirmation:
        description: Deploy only; enter MIGRATIONS-APPLIED-AND-VERIFIED
        required: false
        default: NOT-CONFIRMED
        type: string
      pool_confirmation:
        description: Deploy only; enter POOL-STOPPED after manual app-pool stop
        required: false
        default: NOT-CONFIRMED
        type: string
      path_confirmation:
        description: Deploy only; enter RELEASE-V2-PATHS-CONFIRMED after FTP readcheck
        required: false
        default: NOT-CONFIRMED
        type: string
      deployment_confirmation:
        description: Deploy only; enter DEPLOY RELEASE V2
        required: false
        default: NOT-CONFIRMED
        type: string
      verification_competition_id:
        description: Competition ID for read-only post-start verification
        required: false
        type: string
      expected_results_count:
        required: false
        type: string
      expected_stackers_count:
        required: false
        type: string
      expected_doubles_count:
        required: false
        type: string
      expected_relays_count:
        required: false
        type: string
      enforce_expected_counts:
        description: Verify only; fail when supplied expected counts differ from live values
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: naditrack-production
  cancel-in-progress: false

env:
  RELEASE_MANIFEST: docs/deployment/production-release-v2-manifest.json
  PRODUCTION_BASE_URL: https://wssans-001-site1.htempurl.com
  DOTNET_EF_VERSION: '8.0.8'

jobs:
  preflight:
    name: Release v2 preflight - no production writes
    if: ${{ inputs.operation == 'preflight' }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      LIVE_SHA: ${{ inputs.live_source_sha }}
    steps:
      - name: Checkout exact master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: backend/StackMeet.Api/StackMeet.Api.csproj

      - name: Validate exact source and governed release delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Sha40($v,$n){if($v -notmatch '^[0-9a-fA-F]{40}$'){throw "$n must be exact SHA40"}}
          function SameSet($actual,$expected,$label){
            $a=@($actual|Sort-Object -Unique); $e=@($expected|Sort-Object -Unique)
            $nl=[Environment]::NewLine
            if(($a -join $nl) -cne ($e -join $nl)){throw "$label mismatch.$nl Actual:$nl$($a -join $nl)$nl Expected:$nl$($e -join $nl)"}
          }
          Sha40 $env:DEPLOY_SHA 'commit_sha'; Sha40 $env:LIVE_SHA 'live_source_sha'
          if($env:GITHUB_REF -ne 'refs/heads/master'){throw 'Dispatch must be launched from master'}
          $head=(git rev-parse HEAD).Trim().ToLower(); $want=$env:DEPLOY_SHA.Trim().ToLower()
          if($head -ne $want){throw "Requested $want != master $head"}
          $manifest=Get-Content -LiteralPath $env:RELEASE_MANIFEST -Raw|ConvertFrom-Json
          $live=$env:LIVE_SHA.Trim().ToLower()
          if($live -cne ([string]$manifest.approvedLiveSourceSha).ToLower()){throw 'live_source_sha does not match approved Release v2 baseline'}
          git cat-file -e "$live^{commit}"; if($LASTEXITCODE){throw 'Approved live source SHA not found'}
          git merge-base --is-ancestor $live $want; if($LASTEXITCODE){throw 'Approved live source is not an ancestor of target master'}
          $changed=@(git diff --name-only "$live..$want")
          foreach($path in $changed){
            if($path -ieq 'backend/StackMeet.Api/StackMeet.Api.csproj'){throw 'Production application csproj changed; Release v2 is not valid'}
            if($path -imatch '(^|/)web\.config$'){throw "Forbidden configuration change: $path"}
            if($path -imatch '(^|/)appsettings(?:\..+)?\.json$'){throw "Forbidden configuration change: $path"}
            if($path -imatch '\.sql$'){throw "Unexpected checked-in SQL change: $path"}
          }
          $expectedStatic=@($manifest.applicationFiles|Where-Object{$_.source -like 'backend/StackMeet.Api/wwwroot/*'}|ForEach-Object{[string]$_.source})
          $actualStatic=@($changed|Where-Object{$_ -like 'backend/StackMeet.Api/wwwroot/*'})
          SameSet $actualStatic $expectedStatic 'Static application release set'
          $expectedMigrationFiles=@($manifest.databaseMigrations|ForEach-Object{"backend/StackMeet.Api/Migrations/$_.cs"})
          $actualMigrationFiles=@($changed|Where-Object{$_ -match '^backend/StackMeet\.Api/Migrations/.+\.cs$' -and $_ -notmatch 'StackMeetDbContextModelSnapshot\.cs$'})
          SameSet $actualMigrationFiles $expectedMigrationFiles 'Database migration set'
          if(-not($changed -contains [string]$manifest.modelSnapshot)){throw 'Expected EF model snapshot change is missing'}
          if(@($manifest.applicationFiles).Count -ne 11){throw 'Release v2 must contain exactly 11 application files'}
          if(@($manifest.databaseMigrations).Count -ne 3){throw 'Release v2 must contain exactly 3 database migrations'}
          'MASTER_EXACT_HEAD_GATE=PASS'; 'RELEASE_DELTA_ALLOWLIST=PASS'; 'PRODUCTION_CONNECTIONS=0'; 'PRODUCTION_WRITES=0'

      - name: Restore and build Release
        shell: pwsh
        run: |
          dotnet restore StackMeet.sln --configfile NuGet.Config
          if($LASTEXITCODE){exit $LASTEXITCODE}
          dotnet build StackMeet.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:SourceRevisionId=$env:DEPLOY_SHA
          if($LASTEXITCODE){exit $LASTEXITCODE}

      - name: Generate migration package and resolved application manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version Latest
          dotnet tool install --global dotnet-ef --version $env:DOTNET_EF_VERSION
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $out=Join-Path $env:RUNNER_TEMP 'production-release-v2'; New-Item -ItemType Directory -Force -Path $out|Out-Null
          $sql=Join-Path $out 'migrations.idempotent.sql'
          dotnet ef migrations script --idempotent --project backend/StackMeet.Api/StackMeet.Api.csproj --startup-project backend/StackMeet.Api/StackMeet.Api.csproj --configuration Release --no-build --output $sql
          if($LASTEXITCODE){exit $LASTEXITCODE}
          if(-not(Test-Path -LiteralPath $sql -PathType Leaf)){throw 'Migration package was not generated'}
          $manifest=Get-Content -LiteralPath $env:RELEASE_MANIFEST -Raw|ConvertFrom-Json
          $sqlText=Get-Content -LiteralPath $sql -Raw
          foreach($migration in @($manifest.databaseMigrations)){if(-not$sqlText.Contains([string]$migration)){throw "Generated migration package is missing $migration"}}
          $resolved=@()
          foreach($item in @($manifest.applicationFiles|Sort-Object deployOrder)){
            $source=[string]$item.source
            if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw "Release source missing: $source"}
            $resolved+=[pscustomobject]@{source=$source;remote=[string]$item.remote;expectedLiveState=[string]$item.expectedLiveState;deployOrder=[int]$item.deployOrder;sha256=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToUpper()}
          }
          $resolvedPath=Join-Path $out 'release-manifest.resolved.json'
          $resolved|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $resolvedPath -Encoding utf8
          $manifestHash=(Get-FileHash -LiteralPath $resolvedPath -Algorithm SHA256).Hash.ToUpper()
          $migrationHash=(Get-FileHash -LiteralPath $sql -Algorithm SHA256).Hash.ToUpper()
          $dllHash=($resolved|Where-Object{$_.remote -ceq '/StackMeet.Api.dll'}).sha256
          "RELEASE_MANIFEST_SHA256=$manifestHash"; "MIGRATION_PACKAGE_SHA256=$migrationHash"; "TARGET_DLL_SHA256=$dllHash"
          'RELEASE_FILE_COUNT=11'; 'MIGRATION_COUNT=3'; 'PRODUCTION_CONNECTIONS=0'; 'PRODUCTION_WRITES=0'
          "## Production Release v2 preflight" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Source: $env:DEPLOY_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Approved live baseline source: $env:LIVE_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Application files: 11; migrations: 3" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Resolved manifest SHA256: $manifestHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Migration package SHA256: $migrationHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Target DLL SHA256: $dllHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Production writes: NONE" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload reviewed release-preflight package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-v2-preflight-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/production-release-v2/
          if-no-files-found: error
          retention-days: 14

  ftp_readcheck:
    name: Release v2 FTP baseline - read only
    if: ${{ inputs.operation == 'ftp-readcheck' }}
    runs-on: windows-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      LIVE_SHA: ${{ inputs.live_source_sha }}
      EXPECTED_LIVE_DLL: ${{ inputs.expected_live_dll_sha256 }}
      FTP_HOST: ${{ secrets.PROD_FTP_HOST }}
      FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
      FTP_PORT: ${{ vars.PROD_FTP_PORT }}
      FTP_SSL: ${{ vars.PROD_FTP_ENABLE_SSL }}
    steps:
      - name: Checkout exact master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Read and fingerprint exact live fileset - no remote writes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version Latest
          function Sha40($v,$n){if($v -notmatch '^[0-9a-fA-F]{40}$'){throw "$n must be exact SHA40"}}
          function Sha64($v,$n){if($v -notmatch '^[0-9a-fA-F]{64}$'){throw "$n must be SHA256"}}
          Sha40 $env:DEPLOY_SHA 'commit_sha'; Sha40 $env:LIVE_SHA 'live_source_sha'; Sha64 $env:EXPECTED_LIVE_DLL 'expected_live_dll_sha256'
          if($env:GITHUB_REF -ne 'refs/heads/master'){throw 'Dispatch must be launched from master'}
          $head=(git rev-parse HEAD).Trim().ToLower(); if($head -ne $env:DEPLOY_SHA.Trim().ToLower()){throw 'Master SHA moved'}
          $manifest=Get-Content -LiteralPath $env:RELEASE_MANIFEST -Raw|ConvertFrom-Json
          if($env:LIVE_SHA.Trim().ToLower() -cne ([string]$manifest.approvedLiveSourceSha).ToLower()){throw 'live_source_sha does not match approved Release v2 baseline'}
          foreach($n in 'FTP_HOST','FTP_USER','FTP_PASS','FTP_PORT','FTP_SSL'){if([string]::IsNullOrWhiteSpace((Get-Item "env:$n").Value)){throw "$n missing"}}
          $port=0; if(-not[int]::TryParse($env:FTP_PORT,[ref]$port)-or$port-lt1-or$port-gt65535){throw 'Invalid FTP port'}
          $ssl=switch($env:FTP_SSL.Trim().ToLower()){'true'{$true}'false'{$false}default{throw 'FTP_SSL must be true/false'}}
          function CurlBase{$a=@('--fail','--silent','--show-error','--ftp-pasv','--connect-timeout','30','--max-time','120','--proto','=ftp','--user',"$($env:FTP_USER):$($env:FTP_PASS)");if($ssl){$a+='--ssl-reqd'};return ,$a}
          function RetrMaybe($remote,$out){if(Test-Path -LiteralPath $out){Remove-Item -LiteralPath $out -Force};$a=@(CurlBase);$a+=@('--output',$out,"ftp://$($env:FTP_HOST):$port$remote");& curl.exe @a;return($LASTEXITCODE-eq0-and(Test-Path -LiteralPath $out -PathType Leaf))}
          $outDir=Join-Path $env:RUNNER_TEMP 'production-release-v2-live';New-Item -ItemType Directory -Force -Path $outDir|Out-Null
          $lines=@();$i=0
          foreach($item in @($manifest.applicationFiles|Sort-Object deployOrder)){
            $i++;$remote=[string]$item.remote;$expected=[string]$item.expectedLiveState;$tmp=Join-Path $outDir ("live-{0:D2}.bin"-f$i);$present=RetrMaybe $remote $tmp
            if($expected -ceq 'present' -and -not$present){throw "Expected live file is missing: $remote"}
            if($expected -ceq 'absent' -and $present){throw "Expected new Release v2 file already exists: $remote"}
            if($expected -notin @('present','absent')){throw "Invalid expectedLiveState for $remote"}
            if($present){$hash=(Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash.ToUpper();if($remote -ceq '/StackMeet.Api.dll' -and $hash -cne $env:EXPECTED_LIVE_DLL.Trim().ToUpper()){throw "Live DLL SHA256 mismatch: $hash"};$lines+="$remote|PRESENT|$hash"}else{$lines+="$remote|ABSENT|ABSENT"}
          }
          $statePath=Join-Path $outDir 'live-fileset.txt';$lines|Set-Content -LiteralPath $statePath -Encoding utf8
          $stateHash=(Get-FileHash -LiteralPath $statePath -Algorithm SHA256).Hash.ToUpper()
          "LIVE_FILESET_SHA256=$stateHash";'FTP_READ_ONLY_CHECK=PASS';'PRODUCTION_WRITES=0'
          "## Production Release v2 FTP read-only baseline" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Live fileset SHA256: $stateHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Production writes: NONE" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload live-fileset fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-v2-live-fileset-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/production-release-v2-live/live-fileset.txt
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy governed Release v2 application files
    if: ${{ inputs.operation == 'deploy' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      LIVE_SHA: ${{ inputs.live_source_sha }}
      EXPECTED_PREFLIGHT: ${{ inputs.expected_preflight_manifest_sha256 }}
      EXPECTED_LIVE_FILESET: ${{ inputs.expected_live_fileset_sha256 }}
      EXPECTED_LIVE_DLL: ${{ inputs.expected_live_dll_sha256 }}
      SCHEMA_CONFIRM: ${{ inputs.schema_confirmation }}
      POOL_CONFIRM: ${{ inputs.pool_confirmation }}
      PATH_CONFIRM: ${{ inputs.path_confirmation }}
      DEPLOY_CONFIRM: ${{ inputs.deployment_confirmation }}
      FTP_HOST: ${{ secrets.PROD_FTP_HOST }}
      FTP_USER: ${{ secrets.PROD_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.PROD_FTP_PASSWORD }}
      FTP_PORT: ${{ vars.PROD_FTP_PORT }}
      FTP_SSL: ${{ vars.PROD_FTP_ENABLE_SSL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: backend/StackMeet.Api/StackMeet.Api.csproj
      - name: Validate all Release v2 deploy interlocks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          function Sha40($v,$n){if($v -notmatch '^[0-9a-fA-F]{40}$'){throw "$n must be SHA40"}};function Sha64($v,$n){if($v -notmatch '^[0-9a-fA-F]{64}$'){throw "$n must be SHA256"}}
          Sha40 $env:DEPLOY_SHA 'commit_sha';Sha40 $env:LIVE_SHA 'live_source_sha';Sha64 $env:EXPECTED_PREFLIGHT 'expected_preflight_manifest_sha256';Sha64 $env:EXPECTED_LIVE_FILESET 'expected_live_fileset_sha256';Sha64 $env:EXPECTED_LIVE_DLL 'expected_live_dll_sha256'
          if($env:SCHEMA_CONFIRM -cne 'MIGRATIONS-APPLIED-AND-VERIFIED'){throw 'Schema migration confirmation gate failed'}
          if($env:POOL_CONFIRM -cne 'POOL-STOPPED'){throw 'App-pool interlock failed'}
          if($env:PATH_CONFIRM -cne 'RELEASE-V2-PATHS-CONFIRMED'){throw 'FTP path confirmation gate failed'}
          if($env:DEPLOY_CONFIRM -cne 'DEPLOY RELEASE V2'){throw 'Deployment phrase failed'}
          if($env:GITHUB_REF -ne 'refs/heads/master'){throw 'Dispatch must be launched from master'}
          $head=(git rev-parse HEAD).Trim().ToLower();if($head -ne $env:DEPLOY_SHA.Trim().ToLower()){throw 'Master SHA moved'}
          $manifest=Get-Content -LiteralPath $env:RELEASE_MANIFEST -Raw|ConvertFrom-Json
          if($env:LIVE_SHA.Trim().ToLower() -cne ([string]$manifest.approvedLiveSourceSha).ToLower()){throw 'live_source_sha does not match approved Release v2 baseline'}
      - name: Rebuild exact application source and verify preflight manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          dotnet restore StackMeet.sln --configfile NuGet.Config;if($LASTEXITCODE){exit $LASTEXITCODE}
          dotnet build StackMeet.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:SourceRevisionId=$env:DEPLOY_SHA;if($LASTEXITCODE){exit $LASTEXITCODE}
          $manifest=Get-Content -LiteralPath $env:RELEASE_MANIFEST -Raw|ConvertFrom-Json;$resolved=@()
          foreach($item in @($manifest.applicationFiles|Sort-Object deployOrder)){$source=[string]$item.source;if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw "Release source missing: $source"};$resolved+=[pscustomobject]@{source=$source;remote=[string]$item.remote;expectedLiveState=[string]$item.expectedLiveState;deployOrder=[int]$item.deployOrder;sha256=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToUpper()}}
          $path=Join-Path $env:RUNNER_TEMP 'release-manifest.resolved.json';$resolved|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $path -Encoding utf8;$hash=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpper()
          if($hash -cne $env:EXPECTED_PREFLIGHT.Trim().ToUpper()){throw "Preflight manifest hash mismatch: $hash"};'PREFLIGHT_MANIFEST_REPRODUCED=PASS'
      - name: Recheck live fileset, backup, deploy, verify, and rollback on failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          foreach($n in 'FTP_HOST','FTP_USER','FTP_PASS','FTP_PORT','FTP_SSL','GH_TOKEN'){if([string]::IsNullOrWhiteSpace((Get-Item "env:$n").Value)){throw "$n missing"}}
          $port=0;if(-not[int]::TryParse($env:FTP_PORT,[ref]$port)-or$port-lt1-or$port-gt65535){throw 'Invalid FTP port'};$ssl=switch($env:FTP_SSL.Trim().ToLower()){'true'{$true}'false'{$false}default{throw 'FTP_SSL must be true/false'}}
          $manifest=Get-Content -LiteralPath $env:RELEASE_MANIFEST -Raw|ConvertFrom-Json
          function CurlBase{$a=@('--fail','--silent','--show-error','--ftp-pasv','--connect-timeout','30','--max-time','120','--proto','=ftp','--user',"$($env:FTP_USER):$($env:FTP_PASS)");if($ssl){$a+='--ssl-reqd'};return ,$a}
          function Url($remote){"ftp://$($env:FTP_HOST):$port$remote"}
          function RetrMaybe($remote,$out){if(Test-Path -LiteralPath $out){Remove-Item -LiteralPath $out -Force};$a=@(CurlBase);$a+=@('--output',$out,(Url $remote));& curl.exe @a;return($LASTEXITCODE-eq0-and(Test-Path -LiteralPath $out -PathType Leaf))}
          function Stor($source,$remote){$a=@(CurlBase);$a+=@('--ftp-create-dirs','--upload-file',$source,(Url $remote));& curl.exe @a;if($LASTEXITCODE){throw "STOR failed: $remote"}}
          function DeleteRemote($remote){$root="ftp://$($env:FTP_HOST):$port/";$a=@(CurlBase);$a+=@('--quote',"DELE $remote",$root);& curl.exe @a;if($LASTEXITCODE){throw "DELE failed: $remote"}}
          function Master{$hdr=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};return(Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/master" -Headers $hdr -TimeoutSec 30).sha.ToLower()}
          $backupDir=Join-Path $env:RUNNER_TEMP 'release-v2-backups';New-Item -ItemType Directory -Force -Path $backupDir|Out-Null;$stateLines=@();$backups=@{};$index=0
          foreach($item in @($manifest.applicationFiles|Sort-Object deployOrder)){$index++;$remote=[string]$item.remote;$expectedState=[string]$item.expectedLiveState;$tmp=Join-Path $backupDir ("before-{0:D2}.bin"-f$index);$present=RetrMaybe $remote $tmp;if($expectedState -ceq 'present' -and -not$present){throw "Expected live file missing before write: $remote"};if($expectedState -ceq 'absent' -and $present){throw "Expected new file already exists before write: $remote"};if($present){$hash=(Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash.ToUpper();if($remote -ceq '/StackMeet.Api.dll' -and $hash -cne $env:EXPECTED_LIVE_DLL.Trim().ToUpper()){throw "Live DLL SHA256 mismatch before write: $hash"};$stateLines+="$remote|PRESENT|$hash";$backups[$remote]=$tmp}else{$stateLines+="$remote|ABSENT|ABSENT"}}
          $statePath=Join-Path $backupDir 'live-fileset-before-write.txt';$stateLines|Set-Content -LiteralPath $statePath -Encoding utf8;$stateHash=(Get-FileHash -LiteralPath $statePath -Algorithm SHA256).Hash.ToUpper()
          if($stateHash -cne $env:EXPECTED_LIVE_FILESET.Trim().ToUpper()){throw "Live fileset drifted since ftp-readcheck: $stateHash"};'LIVE_FILESET_RECHECK=PASS';'PRE_UPLOAD_BACKUP=PASS'
          if((Master)-ne$env:DEPLOY_SHA.Trim().ToLower()){throw 'Master advanced; no write attempted'};'MASTER_RECHECK_BEFORE_WRITE=PASS'
          $written=[System.Collections.Generic.List[object]]::new()
          try{
            foreach($item in @($manifest.applicationFiles|Sort-Object deployOrder)){$source=[string]$item.source;$remote=[string]$item.remote;$expectedState=[string]$item.expectedLiveState;$localHash=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToUpper();Stor $source $remote;$written.Add([pscustomobject]@{remote=$remote;expectedLiveState=$expectedState;localHash=$localHash})|Out-Null;$check=Join-Path $backupDir ("after-{0:D2}.bin"-f$written.Count);if(-not(RetrMaybe $remote $check)){throw "Post-upload RETR failed: $remote"};$remoteHash=(Get-FileHash -LiteralPath $check -Algorithm SHA256).Hash.ToUpper();if($remoteHash -cne $localHash){throw "Post-upload hash mismatch: $remote"}}
            'RELEASE_V2_APPLICATION_DEPLOYMENT=PASS';'POST_UPLOAD_FILE_COUNT=11';'POOL_STATE=STOPPED-MANUAL-START-REQUIRED'
          }catch{
            $first=$_.Exception.Message;$rollbackOk=$true;$rollbackErrors=[System.Collections.Generic.List[string]]::new()
            for($i=$written.Count-1;$i-ge0;$i--){$entry=$written[$i];try{if($entry.expectedLiveState -ceq 'present'){$backup=[string]$backups[$entry.remote];Stor $backup $entry.remote;$verify=Join-Path $backupDir ("rollback-{0:D2}.bin"-f$i);if(-not(RetrMaybe $entry.remote $verify)){throw 'Rollback RETR failed'};$beforeHash=(Get-FileHash -LiteralPath $backup -Algorithm SHA256).Hash.ToUpper();$afterHash=(Get-FileHash -LiteralPath $verify -Algorithm SHA256).Hash.ToUpper();if($afterHash -cne $beforeHash){throw 'Rollback hash mismatch'}}else{DeleteRemote $entry.remote;$verifyAbsent=Join-Path $backupDir ("rollback-absent-{0:D2}.bin"-f$i);if(RetrMaybe $entry.remote $verifyAbsent){throw 'Rollback delete verification failed'}}}catch{$rollbackOk=$false;$rollbackErrors.Add("$($entry.remote): $($_.Exception.Message)")|Out-Null}}
            'ROLLBACK_ATTEMPTED=True';if($rollbackOk){'ROLLBACK_VERIFIED=True';throw "Release v2 deploy failed; application-file rollback verified. $first"};'ROLLBACK_VERIFIED=False';'PRODUCTION_STATE=UNKNOWN';'DO NOT START THE POOL';throw "CRITICAL rollback unverified. $first / $($rollbackErrors -join ' | ')"
          }

  verify:
    name: Release v2 post-start verification - read only
    if: ${{ inputs.operation == 'verify' }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CID: ${{ inputs.verification_competition_id }}
      ER: ${{ inputs.expected_results_count }}
      ES: ${{ inputs.expected_stackers_count }}
      ED: ${{ inputs.expected_doubles_count }}
      EL: ${{ inputs.expected_relays_count }}
      ENFORCE_COUNTS: ${{ inputs.enforce_expected_counts }}
    steps:
      - name: Verify app, profile-link contract, static assets, privacy, and counts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          if([string]::IsNullOrWhiteSpace($env:CID)){throw 'verification_competition_id required'}
          $enforce=switch($env:ENFORCE_COUNTS.Trim().ToLower()){'true'{$true}'false'{$false}default{throw 'enforce_expected_counts must be true/false'}}
          function Get200($u){$r=Invoke-WebRequest $u -TimeoutSec 30 -MaximumRedirection 5;if($r.StatusCode-ne200){throw "$u returned $($r.StatusCode)"};return$r}
          function CountCheck($a,$e,$n){$actual=@($a).Count;if([string]::IsNullOrWhiteSpace($e)){return$actual};$x=0;if(-not[int]::TryParse($e,[ref]$x)-or$x-lt0){throw "Invalid $n count"};if($actual-ne$x){Write-Output "::warning title=Production data count drift::$n expected $x but live is $actual";if($enforce){throw "$n count mismatch"}};return$actual}
          function Privacy($v,$p='$'){if($null-eq$v){return};$bad=@('password','passwordhash','apikey','token','resettoken','securitystamp','connectionstring','connectionstrings','adminkey','birthdate','email','phone');if($v-is[pscustomobject]){foreach($q in $v.PSObject.Properties){if($bad-icontains$q.Name){throw "Forbidden key $($q.Name) at $p"};Privacy $q.Value "$p.$($q.Name)"}}elseif($v-is[Collections.IDictionary]){foreach($k in $v.Keys){if($bad-icontains[string]$k){throw "Forbidden key $k at $p"};Privacy $v[$k] "$p.$k"}}elseif($v-is[Collections.IEnumerable]-and$v-isnot[string]){foreach($i in $v){Privacy $i $p}}}
          $b=$env:PRODUCTION_BASE_URL.TrimEnd('/');Get200 "$b/api/health"|Out-Null;Get200 "$b/api/version"|Out-Null;Get200 "$b/results/profile-links.js"|Out-Null;Get200 "$b/profile/index.html"|Out-Null;Get200 "$b/profile/profile.js"|Out-Null;Get200 "$b/app.js"|Out-Null;Get200 "$b/js/reports/FinalsRankingPolicy.js"|Out-Null
          $id=[Uri]::EscapeDataString($env:CID.Trim());$j=(Get200 "$b/api/public/competitions/$id/results").Content|ConvertFrom-Json -Depth 100
          foreach($n in 'settings','translations','results','stackers','doubles','relays'){if(-not($j.PSObject.Properties.Name-contains$n)){throw "Missing $n"}};Privacy $j
          $links=(Get200 "$b/api/public/competitions/$id/profile-links").Content|ConvertFrom-Json -Depth 50;if(-not($links.PSObject.Properties.Name-contains'links')){throw 'Missing profile-links links collection'};Privacy $links
          $resultsCount=CountCheck $j.results $env:ER 'results';$stackersCount=CountCheck $j.stackers $env:ES 'stackers';$doublesCount=CountCheck $j.doubles $env:ED 'doubles';$relaysCount=CountCheck $j.relays $env:EL 'relays'
          'POST_START_HTTP_VALIDATION=PASS';'RELEASE_V2_STATIC_ASSETS=PASS';'PUBLIC_PROFILE_LINK_CONTRACT=PASS';'PRIVACY_CHECK=PASS';"RESULTS_COUNT=$resultsCount";"STACKERS_COUNT=$stackersCount";"DOUBLES_COUNT=$doublesCount";"RELAYS_COUNT=$relaysCount";"COUNT_ENFORCEMENT=$enforce";'PRODUCTION_WRITES=0'
