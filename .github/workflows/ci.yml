name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "feature/**"
      - "hardening/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: backend/StackMeet.Api/StackMeet.Api.csproj

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore .NET dependencies
        run: dotnet restore StackMeet.sln --configfile NuGet.Config

      - name: Build Release
        run: dotnet build StackMeet.sln -c Release --no-restore

      - name: Check canonical authentication and storage scripts
        run: |
          node --check backend/StackMeet.Api/wwwroot/js/auth/AuthSession.js
          node --check backend/StackMeet.Api/wwwroot/js/storage/ApiProvider.js
          node --check backend/StackMeet.Api/wwwroot/js/storage/Repository.js
          node --check backend/StackMeet.Api/wwwroot/js/storage/ResultApi.js
          node --check backend/StackMeet.Api/wwwroot/js/storage/StackerApi.js

      - name: Run storage smoke tests
        run: node backend/StackMeet.Api/wwwroot/js/storage/storage-smoke.test.js

      - name: Run complete JavaScript regression suite
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests -Filter *.test.js | Sort-Object Name
          Write-Host "Running $($tests.Count) JavaScript regression tests"
          foreach ($test in $tests) {
            Write-Host "::group::$($test.Name)"
            node $test.FullName
            $exitCode = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($exitCode -ne 0) {
              exit $exitCode
            }
          }
